{% extends "base.html" %}
{% block content %}
<h2>My Bookings</h2>
<table>
    <tr><th>Booked on</th><th>Event</th><th>Date</th><th>Qty</th><th>Paid</th></tr>
    {% for b in bookings %}
    <tr>
        <td>{{ b.time|date:"d M Y, h:i A" }}</td>
        <td>{{ b.slot.event.name }}</td>
        <td>{{ b.slot.start|date:"d M Y, h:i A" }}</td>
        <td>{{ b.quantity }}</td>
        <td>Rs {{ b.total }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="5">No bookings yet.</td></tr>
    {% endfor %}
</table>
{% endblock %}
