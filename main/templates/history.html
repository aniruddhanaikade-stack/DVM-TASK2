{% extends "base.html" %}
{% block content %}
<h2>Transaction History</h2>
<table>
    <tr><th>Time</th><th>Note</th><th>Amount</th></tr>
    {% for t in items %}
    <tr>
        <td>{{ t.time|date:"d M Y, h:i:s A" }}</td>
        <td>{{ t.note }}</td>
        <td>{% if t.amount > 0 %}+{% endif %}{{ t.amount }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="3">No transactions yet.</td></tr>
    {% endfor %}
</table>
{% endblock %}
