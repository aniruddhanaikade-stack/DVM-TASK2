<!DOCTYPE html>
<html>
<head>
    <title>GoOut</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: auto; padding: 10px; }
        nav a { margin-right: 12px; }
        nav { border-bottom: 1px solid #ccc; padding-bottom: 8px; margin-bottom: 15px; }
        table { border-collapse: collapse; width: 100%; }
        td, th { border: 1px solid #ccc; padding: 6px; text-align: left; }
        .box { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}"><b>GoOut</b></a>
        {% if user.is_authenticated %}
            <a href="{% url 'tickets' %}">Active Tickets</a>
            <a href="{% url 'bookings' %}">My Bookings</a>
            <a href="{% url 'history' %}">Transactions</a>
            <a href="{% url 'add_money' %}">Add Money</a>
            <form method="post" action="{% url 'logout' %}" style="display:inline">
                {% csrf_token %}
                <button>Logout ({{ user.username }})</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'signup' %}">Sign up</a>
        {% endif %}
    </nav>

    {% for m in messages %}
        <p class="{{ m.tags }}">{{ m }}</p>
    {% endfor %}

    {% block content %}{% endblock %}
</body>
</html>
